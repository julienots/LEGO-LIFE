<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LEGO POWERS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b9e8; touch-action: none;
    -webkit-user-select: none; user-select: none; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #title { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); color: #fff;
    font-weight: 900; font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 0 #b00, 0 0 12px #f22;
    pointer-events: none; }
  #joy { position: fixed; width: 130px; height: 130px; border-radius: 50%; display: none;
    background: rgba(255,255,255,.15); border: 3px solid rgba(255,255,255,.5); pointer-events: none; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,60,40,.85); box-shadow: 0 0 14px #f22; }
  #jump { position: fixed; right: 28px; bottom: 28px; width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,60,40,.8); color: #fff; font-weight: 900; font-size: 15px; border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 16px #f22; }
  #select { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 18px; background: linear-gradient(transparent 45%, rgba(0,0,0,.55)); }
  #select h1 { position: absolute; top: 34px; margin: 0; color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 2px 6px #000; }
  #cards { display: flex; gap: 14px; margin-bottom: 14px; }
  .card { width: 104px; border-radius: 12px; overflow: hidden; background: #222; border: 3px solid rgba(255,255,255,.35);
    color: #fff; font-weight: 800; font-size: 13px; text-align: center; cursor: pointer; }
  .card img { display: block; width: 100%; height: 104px; object-fit: cover; background: #87b9e8; }
  .card div { padding: 5px 0; }
  .card.on { border-color: #ffd500; box-shadow: 0 0 16px #ffd500; transform: scale(1.06); }
  #play { padding: 12px 46px; border-radius: 30px; border: 3px solid #fff; background: #e3000b; color: #fff;
    font-weight: 900; font-size: 18px; letter-spacing: 2px; box-shadow: 0 0 16px #f22; cursor: pointer; }
  #persos { position: fixed; top: 10px; left: 12px; padding: 8px 14px; border-radius: 18px; border: 2px solid #fff;
    background: rgba(0,0,0,.35); color: #fff; font-weight: 800; font-size: 13px; display: none; cursor: pointer; }
  .playing #select { display: none; }
  .playing #persos { display: block; }
  body:not(.playing) #jump, body:not(.playing) #hint { display: none; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 12px;
    opacity: .8; pointer-events: none; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="title">LEGO POWERS</div>
<div id="joy"><div id="knob"></div></div>
<div id="jump">SAUT</div>
<div id="select"><h1>CHOISIS TON LEGO</h1><div id="cards"></div><button id="play">JOUER</button></div>
<button id="persos">PERSOS</button>
<div id="hint">Gauche : bouger · Droite : glisser pour tourner la caméra</div>
<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
